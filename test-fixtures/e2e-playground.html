<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Bridge E2E Playground</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; line-height: 1.5; }
      h1 { margin-top: 0; }
      section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin: 16px 0; }
      label { display: block; margin: 8px 0; }
      input, select, button { font-size: 1rem; padding: 6px 8px; }
      #status {
        position: sticky; top: 0; background: #0b5; color: #fff; padding: 10px 14px;
        border-radius: 6px; font-weight: 600; z-index: 10;
      }
      .filler { height: 600px; background: repeating-linear-gradient(#f6f6f6, #f6f6f6 40px, #eee 40px, #eee 80px); }
    </style>
  </head>
  <body>
    <h1>Agent Bridge E2E Playground</h1>
    <!-- The status line is updated by every interaction so tests can verify via browser_snapshot. -->
    <div id="status" role="status">status: idle</div>

    <section aria-label="Login form">
      <h2>Form</h2>
      <!-- TC-PERC: named via <label for> -->
      <label for="email">Email address</label>
      <input id="email" type="text" />

      <!-- TC-PERC: named via aria-labelledby -->
      <span id="pwd-label">Password</span>
      <input aria-labelledby="pwd-label" type="password" id="password" />

      <!-- TC-PERC: named via placeholder -->
      <input type="text" placeholder="Search query" id="search" />

      <!-- TC-ACT: select by visible label or value -->
      <label for="fruit">Favorite fruit</label>
      <select id="fruit">
        <option value="a">Apple</option>
        <option value="b">Banana</option>
        <option value="c">Cherry</option>
      </select>

      <form id="login-form">
        <button type="submit" id="submit-btn">Sign in</button>
      </form>
    </section>

    <section aria-label="Buttons and links">
      <h2>Buttons &amp; links</h2>
      <!-- TC-ACT: synthetic click is fine here -->
      <button id="counter">Click counter: <span id="count">0</span></button>

      <!-- TC-ACT (trusted): only a real (isTrusted) event flips this; synthetic is ignored -->
      <button id="trusted-only">Trusted-only button</button>

      <!-- TC-ACT: hover indicator -->
      <button id="hover-target">Hover me</button>

      <a href="#section-bottom" id="jump-link">Jump to bottom</a>
    </section>

    <!-- TC-PERC (Phase C): shadow DOM, same-origin iframe, hidden variants, extra roles. -->
    <section aria-label="Perception fidelity">
      <h2>Perception fidelity</h2>

      <!-- Open shadow root: its button must appear in the snapshot. -->
      <div id="shadow-open"></div>
      <!-- Closed shadow root: its button must NOT appear. -->
      <div id="shadow-closed"></div>

      <!-- Same-origin iframe: its button must appear; a trusted click must land on it. -->
      <iframe id="inner-frame" title="Inner frame" width="320" height="90" style="border:1px solid #ccc"></iframe>

      <!-- None of these four may appear in a snapshot. -->
      <div aria-hidden="true"><button id="decoy-aria">Decoy: aria-hidden</button></div>
      <div inert><button id="decoy-inert">Decoy: inert</button></div>
      <div style="display:none"><button id="decoy-display">Decoy: display none ancestor</button></div>
      <button id="decoy-zero" style="width:0;height:0;padding:0;border:0;overflow:hidden">Decoy: zero size</button>

      <!-- Extra roles. -->
      <label for="qty">Quantity</label>
      <input id="qty" type="number" value="1" />
      <label for="volume">Volume</label>
      <input id="volume" type="range" />
      <label for="tags">Tags</label>
      <select id="tags" multiple size="3">
        <option value="x">Xylophone</option>
        <option value="y">Yak</option>
      </select>
      <div id="editor" contenteditable="true" aria-label="Notes editor" style="border:1px solid #ccc;padding:6px">
        Editable notes
      </div>
      <div role="tab" tabindex="0" id="fake-tab" style="display:inline-block;border:1px solid #ccc;padding:6px">
        Details tab
      </div>
      <button id="disabled-btn" disabled>Disabled action</button>
    </section>

    <section aria-label="Async content">
      <h2>Async (for wait_for)</h2>
      <!-- TC-WAIT: text appears 1.5s after click -->
      <button id="load-later">Load message in 1.5s</button>
      <div id="async-area"></div>
    </section>

    <section aria-label="Long content for full-page screenshot">
      <h2>Scroll / full-page region</h2>
      <div class="filler"></div>
      <p id="section-bottom">BOTTOM MARKER — visible only after scrolling or in a full-page screenshot.</p>
    </section>

    <script>
      const status = document.getElementById("status");
      const set = (msg) => { status.textContent = "status: " + msg; };

      document.getElementById("email").addEventListener("input", (e) => set("email = " + e.target.value));
      document.getElementById("password").addEventListener("input", (e) => set("password length = " + e.target.value.length));
      document.getElementById("search").addEventListener("input", (e) => set("search = " + e.target.value));
      document.getElementById("fruit").addEventListener("change", (e) => set("fruit = " + e.target.value));

      let count = 0;
      const countEl = document.getElementById("count");
      document.getElementById("counter").addEventListener("click", () => { count += 1; countEl.textContent = String(count); set("counter = " + count); });

      // Only a real, trusted event updates this — proves the chrome.debugger trusted-input path.
      document.getElementById("trusted-only").addEventListener("click", (e) => {
        set(e.isTrusted ? "TRUSTED click received" : "synthetic click ignored");
      });

      document.getElementById("hover-target").addEventListener("mouseover", () => set("hovered"));

      const form = document.getElementById("login-form");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        set("form submitted (email = " + document.getElementById("email").value + ")");
      });

      // Open shadow root — buildSnapshot must descend into it.
      const openRoot = document.getElementById("shadow-open").attachShadow({ mode: "open" });
      openRoot.innerHTML = '<button id="shadow-btn">Shadow button</button>';
      openRoot.getElementById("shadow-btn").addEventListener("click", () => set("shadow button clicked"));

      // Closed shadow root — must stay invisible to the snapshot.
      document.getElementById("shadow-closed")
        .attachShadow({ mode: "closed" })
        .innerHTML = '<button>Sealed button (must not be listed)</button>';

      // Same-origin iframe, written from here so the fixture stays a single file.
      const frameDoc = document.getElementById("inner-frame").contentDocument;
      frameDoc.body.innerHTML = '<button id="frame-btn">Iframe button</button><p id="frame-status">iframe: idle</p>';
      frameDoc.getElementById("frame-btn").addEventListener("click", (e) => {
        frameDoc.getElementById("frame-status").textContent = e.isTrusted ? "iframe: TRUSTED click" : "iframe: synthetic click";
        set("iframe button clicked (isTrusted = " + e.isTrusted + ")");
      });

      document.getElementById("fake-tab").addEventListener("click", () => set("role=tab clicked"));
      document.getElementById("qty").addEventListener("input", (e) => set("qty = " + e.target.value));

      document.getElementById("load-later").addEventListener("click", () => {
        set("loading…");
        setTimeout(() => { document.getElementById("async-area").textContent = "Async content loaded!"; set("async content loaded"); }, 1500);
      });
    </script>
  </body>
</html>
